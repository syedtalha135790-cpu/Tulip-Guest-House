<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Login - Tulip Guest House</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-warm d-flex flex-column min-vh-100">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-murree sticky-top py-3">
    <div class="container">
      <a class="navbar-brand brand-logo-container" href="index.html">
        <div class="brand-logo-box">
          <i class="bi bi-flower1"></i>
        </div>
        <div class="brand-text-block">
          <span class="brand-title-main">Tulip Guest House</span>
          <span class="brand-tagline-sub">Murree, Pakistan</span>
        </div>
      </a>
    </div>
  </nav>

  <!-- Login Form Container -->
  <div class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card card-murree p-4 p-sm-5 shadow-lg border-0">
          <div class="text-center mb-4">
            <h2 class="font-heading fw-bold">Guest Portal Login</h2>
            <p class="text-muted small">Sign in to manage your room reservations at Tulip Guest House</p>
          </div>

          <form id="customerLoginForm">
            <div class="mb-3">
              <label class="form-label fw-semibold">Email Address *</label>
              <input type="email" class="form-control form-control-lg" id="loginEmail" placeholder="name@example.com" required value="guest@example.com">
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold">Password *</label>
              <input type="password" class="form-control form-control-lg" id="loginPassword" placeholder="••••••••" required value="guest123">
            </div>

            <button type="submit" class="btn btn-sage btn-lg w-100 py-3 fw-bold shadow-sm mb-3">
              <i class="bi bi-box-arrow-in-right me-1"></i> Log In
            </button>
          </form>

          <div class="text-center pt-3 border-top">
            <p class="text-muted small mb-0">Don't have an account? <a href="signup.html" class="text-success fw-bold">Sign Up Here</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="mt-auto">
    <div class="container text-center text-muted fs-6">
      <p class="m-0">&copy; 2026 Tulip Guest House. All Rights Reserved.</p>
    </div>
  </footer>

  <!-- JS Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/main.js"></script>

  <script>
    document.getElementById('customerLoginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const pass = document.getElementById('loginPassword').value;

      const res = loginCustomer(email, pass);
      if (res.success) {
        showToast("Logged in successfully!");
        setTimeout(() => window.location.href = 'customer-dashboard.html', 800);
      } else {
        alert(res.message);
      }
    });
  </script>
</body>
</html>
