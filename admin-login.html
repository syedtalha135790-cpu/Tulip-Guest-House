<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal - Tulip Guest House</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-dark text-light min-vh-100 d-flex align-items-center">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card bg-secondary bg-opacity-10 border border-secondary p-4 p-sm-5 shadow-lg rounded-4 text-white">
          <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-success bg-opacity-20 text-success rounded-circle mb-3" style="width: 70px; height: 70px;">
              <i class="bi bi-shield-lock-fill fs-1"></i>
            </div>
            <h3 class="font-heading fw-bold text-white mb-1">Tulip Guest House</h3>
            <span class="badge bg-success mb-2">ADMINISTRATION CONTROL</span>
            <p class="text-secondary small">Access room management, bookings, pricing & availability matrix</p>
          </div>

          <form id="adminLoginForm">
            <div class="mb-3">
              <label class="form-label text-light fw-semibold">Admin Email *</label>
              <input type="email" class="form-control form-control-lg bg-dark text-white border-secondary" id="adminEmail" required value="admin@tulipguesthouse.com">
            </div>
            <div class="mb-4">
              <label class="form-label text-light fw-semibold">Password *</label>
              <input type="password" class="form-control form-control-lg bg-dark text-white border-secondary" id="adminPassword" required value="admin123">
            </div>

            <button type="submit" class="btn btn-sage btn-lg w-100 py-3 fw-bold shadow-sm">
              <i class="bi bi-box-arrow-in-right me-1"></i> Enter Admin Control
            </button>
          </form>
          
          <div class="text-center mt-4">
            <a href="index.html" class="text-secondary small text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Back to Public Website</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- JS Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/admin.js"></script>
  <script src="assets/js/main.js"></script>

  <script>
    document.getElementById('adminLoginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value;
      const pass = document.getElementById('adminPassword').value;

      const res = loginAdmin(email, pass);
      if (res.success) {
        showToast("Admin authenticated!");
        setTimeout(() => window.location.href = 'admin-dashboard.html', 800);
      } else {
        alert(res.message);
      }
    });
  </script>
</body>
</html>
